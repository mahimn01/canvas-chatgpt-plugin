[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "canvas-chatgpt-plugin"
version = "0.1.0"
description = "A read-only Canvas LMS companion for ChatGPT over MCP"
authors = [{name = "Mahimn Patel"}]
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "mcp>=1.30,<2", "aiohttp>=3.14.4,<4", "PyJWT[crypto]>=2.15,<3",
  "cryptography>=50,<51", "uvicorn>=0.54,<1", "pypdf>=6.19,<7",
  "defusedxml>=0.7,<1", "python-multipart>=0.0.32,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "httpx>=0.28,<1", "ruff>=0.16,<1", "pip-audit>=2.10,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_companion"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/plugin-template", "/docs",
  "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/SECURITY.md",
  "/institutions.example.json", "/.env.example",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
